# PLAINTEXT — encrypt before committing:
#   sops -e -i secrets/cloudflared-chiyo.yaml
#
# Paste the full contents of the <uuid>.json credentials file cloudflared
# wrote locally at `cloudflared tunnel create chiyo` (see
# modules/dendrites/cloudflared.nix, "Getting started") under `credentials:`
# below, verbatim, then encrypt in place with the command above.
#
# To create your age key (once), if you don't already have one:
#   mkdir -p ~/.config/sops/age
#   age-keygen -o ~/.config/sops/age/keys.txt
#   # the public key (age1...) must already be chiyo's line in .sops.yaml
cloudflared:
    credentials: "PASTE_CHIYO_TUNNEL_CREDENTIALS_JSON_HERE"
