<!-- Central login for necoconeco.net's Melete-hosted apps.
     Served by Caddy at auth.necoconeco.net (root and /login). The password
     IS Melete's app-auth-token: this page probes it against /verify (Caddy
     proxies that path to a live Melete app; the app's host-layer auth gate
     is the actual check, not this app). On success the token is stored in
     the sp_session cookie, scoped to Domain=.necoconeco.net so every
     necoconeco.net site shares it -- that's what makes this "central"
     rather than per-site. Caddy then translates the cookie into the
     Authorization: Bearer header each protected site's Melete app expects.

     `return` is read from the query string and used as the post-login
     redirect. Only a bare https://<subdomain>.necoconeco.net/ is honored
     (checked client-side below) -- anything else is dropped rather than
     followed, so this can't be used as an open redirect to somewhere off
     the domain. -->

<style>
  :root {
    --ground:  #1c1712;
    --panel:   #262019;
    --panel-2: #2f2820;
    --line:    #3d3329;
    --text:    #f2e8d5;
    --muted:   #b3a188;
    --faint:   #7e6f5c;
    --ok:      #77c48b;
    --fail:    #e5826f;
    --accent:  #f2a13d;
    --sans:    system-ui, -apple-system, "Segoe UI", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --radius:  14px;
    --shadow:  0 2px 14px rgba(0, 0, 0, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 340px;
    background: linear-gradient(135deg, var(--panel) 0%, #322a1f 100%);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px 28px;
    text-align: center;
  }
  .cat { width: 96px; height: 96px; margin: 0 auto 14px;
         filter: drop-shadow(0 2px 6px rgba(242, 161, 61, 0.25)); }
  .cat svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .subtitle { font-size: 12.5px; color: var(--muted); margin: 4px 0 20px; word-break: break-word; }
  label { display: block; text-align: left; font-size: 12px; color: var(--faint);
          margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 10px 12px; margin-bottom: 14px;
    background: var(--ground); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 14px; outline: none;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 10px 12px;
    background: var(--accent); color: #1c1712;
    border: none; border-radius: 8px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.55; cursor: default; }
  #err { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--fail); }
  #done { display: none; font-size: 13.5px; color: var(--ok); }
</style>

  </div>
  <h1>necoconeco.net</h1>
  <p class="subtitle" id="subtitle">admin sign in</p>
  <form id="login-form">
    <label for="pw">Password</label>
    <input type="password" id="pw" name="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">Sign in</button>
  </form>
  <p id="err" role="alert"></p>
  <p id="done"></p>
</div>
<script>
(function () {
  var COOKIE = "sp_session";
  var COOKIE_DOMAIN = ".necoconeco.net";

  function validReturn(raw) {
    if (!raw) { return null; }
    var m = /^https:\/\/[a-z0-9-]+\.necoconeco\.net\/?$/.exec(raw);
    return m ? raw : null;
  }

  var returnTo = validReturn(new URLSearchParams(window.location.search).get("return"));

  function readSession() {
    var parts = document.cookie.split(/;\s*/);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].indexOf(COOKIE + "=") === 0) {
        return decodeURIComponent(parts[i].slice(COOKIE.length + 1));
      }
    }
    return null;
  }

  function clearSession() {
    document.cookie = COOKIE + "=; domain=" + COOKIE_DOMAIN +
      "; path=/; max-age=0; secure; samesite=lax";
  }

  function setSession(token) {
    document.cookie = COOKIE + "=" + encodeURIComponent(token) +
      "; domain=" + COOKIE_DOMAIN + "; path=/; max-age=31536000; secure; samesite=lax";
  }

  function probe(token) {
    return fetch("/verify", { headers: { "Authorization": "Bearer " + token } });
  }

  function onSignedIn() {
    if (returnTo) {
      window.location.replace(returnTo);
      return;
    }
    document.getElementById("login-form").style.display = "none";
    var done = document.getElementById("done");
    done.textContent = "Signed in.";
    done.style.display = "block";
  }

  var subtitle = document.getElementById("subtitle");
  if (returnTo) {
    subtitle.textContent = "sign in to continue to " + returnTo.replace(/^https:\/\//, "").replace(/\/$/, "");
  }

  var existing = readSession();
  if (existing) {
    probe(existing).then(function (r) {
      if (r.ok) { onSignedIn(); }
      else if (r.status === 401) { clearSession(); }
    }).catch(function () { /* stay on the form */ });
  }

  var form = document.getElementById("login-form");
  var err = document.getElementById("err");
  var btn = document.getElementById("btn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    if (!pw) { return; }
    btn.disabled = true;
    err.textContent = "";
    probe(pw).then(function (r) {
      if (r.ok) {
        setSession(pw);
        onSignedIn();
      } else if (r.status === 401) {
        err.textContent = "Wrong password.";
        btn.disabled = false;
      } else {
        err.textContent = "Unexpected error (" + r.status + ").";
        btn.disabled = false;
      }
    }).catch(function () {
      err.textContent = "Network error — try again.";
      btn.disabled = false;
    });
  });
})();
</script>
